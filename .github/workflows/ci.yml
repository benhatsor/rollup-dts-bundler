name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Clear GitHub token privileges
permissions:
  contents: read

# Cancel identical concurrent CI runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Run the suite and enforce the coverage thresholds in vitest.config.ts.
      # `test/dist.test.ts` rebuilds dist/ in its own `beforeAll`, so a broken
      # `npm run build` surfaces here as a failed test rather than needing a
      # separate Build step.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: ./coverage/lcov.info