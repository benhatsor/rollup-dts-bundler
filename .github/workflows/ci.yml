name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Clear GitHub token permissions
permissions:
  contents: read

# Cancel identical concurrent CI runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.10.0', 'lts/*']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict # Fail on dep min node version mismatch

      - name: Typecheck
        run: npm run typecheck

      # Ensure build succeeds
      - name: Build
        run: npm run build

      # Run tests and see if coverage changed
      # (maintainer diagnostic to prevent test regression)
      - name: Run tests with coverage
        run: npm run test:coverage