name: Release

on:
  workflow_call:
    inputs:
      is-auto:
        required: true
        type: boolean

# Queue release jobs
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full branch/tag history
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Re-run tests with the full merged code. Uses `test:coverage` (not
      # `test`) so the coverage threshold is enforced at release time too —
      # if anything bypassed CI, the release gate still catches it.
      # `test/dist.test.ts` self-builds dist via its own `beforeAll`, so
      # this step doesn't depend on a prior build.
      - name: Run tests
        run: npm run test:coverage

      # Build the publish artifact. The test step already builds dist as a
      # side effect of `test/dist.test.ts`, but running `build` explicitly
      # here keeps the build > publish chain readable in the workflow.
      - name: Build
        run: npm run build

      # User-created tag: auto-generate changelog and publish.
      - name: Manual release
        if: ${{ !inputs.is-auto }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm publish --provenance --access public
          npx conventional-changelog -p angular \
            | gh release create "$GITHUB_REF_NAME" -F -

      # Renovate-authored merge to main: publish via semantic-release.
      - name: Automatic release
        if: ${{ inputs.is-auto }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release