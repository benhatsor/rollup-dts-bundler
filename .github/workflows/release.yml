name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

# Queue release jobs
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Re-run tests on the full merged code before
  # publishing a release.
  verify:
    # Run on any tag push (manual release) or Renovate-authored
    # push to main (automatic release).
    if: github.ref_type == 'tag' || github.actor == 'renovate[bot]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref_type == 'tag' || github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full branch/tag history
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Tag push: auto-generate changelog and publish.
      - name: Manual release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm publish --provenance --access public
          npx conventional-changelog -p angular \
            | gh release create "$GITHUB_REF_NAME" -F -

      # Renovate-authored merge to main: publish via semantic-release.
      # `ref_type == 'branch'` is defensive: GitHub already blocks the
      # tag semantic-release pushes from re-triggering this workflow
      # when using the default GitHub token, but the gate prevents a double-publish
      # via the manual path if a different token is ever wired in later.
      - name: Automatic release
        if: github.actor == 'renovate[bot]' && github.ref_type == 'branch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release