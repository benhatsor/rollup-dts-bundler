name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

# Queue release jobs
concurrency:
  group: release
  queue: max

jobs:
  # Re-run tests on the full merged code before publishing a release.
  verify:
    # Run only on a manual tag push or a Renovate-authored push (auto-merge) to main.
    if: github.ref_type == 'tag' || github.actor == 'renovate[bot]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref_type == 'tag' || github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full branch/tag history
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Build for release
      - name: Build
        run: npm run build

      # Manual tag push: auto-generate changelog and publish.
      - name: Manual release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm publish --provenance --access public
          npx conventional-changelog -p angular \
            | gh release create "$GITHUB_REF_NAME" -F -

      # Renovate-authored merge to main: publish via semantic-release.
      - name: Automatic release
        if: github.actor == 'renovate[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
