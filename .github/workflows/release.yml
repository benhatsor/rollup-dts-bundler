name: Release

on:
  workflow_call:
    inputs:
      is-auto:
        required: true
        type: boolean

# Queue release jobs
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Re-run tests on the full merged code before
  # publishing an auto-merged Renovate release.
  verify:
    if: ${{ inputs.is-auto }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full branch/tag history
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # User-created tag: auto-generate changelog and publish.
      - name: Manual release
        if: ${{ !inputs.is-auto }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm publish --provenance --access public
          npx conventional-changelog -p angular \
            | gh release create "$GITHUB_REF_NAME" -F -

      # Renovate-authored merge to main: publish via semantic-release.
      - name: Automatic release
        if: ${{ inputs.is-auto }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release